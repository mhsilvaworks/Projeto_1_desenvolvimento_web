<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Confira a galeria completa de fotos das bicicletas SoftBike e conheça nossos modelos para todas as idades.">
  <title>Galeria de Fotos - SoftBike</title>

  <!-- Estilos e Favicon -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="img/FaviconSoftBike.jpeg">
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header class="topo">
    <a href="index.html" class="logo" aria-label="Página inicial SoftBike">
      <img src="img/LogoSoftBike.jpeg" alt="Logo SoftBike" width="150" height="50">
    </a>
    
    <nav aria-label="Navegação principal">
      <ul class="listahorizontal">
        <li><a href="index.html">Início</a></li>
        <li><a href="empresa.html">Empresa</a></li>
        <li><a href="index.html#produtos">Produtos</a></li>
        <li><a href="galeria.html" aria-current="page">Galeria</a></li>
        <li><a href="index.html#diferenciais">Diferenciais</a></li>
        <li><a href="parceiros.html">Parceiros</a></li>
        <li><a href="index.html#contato">Contato</a></li>
      </ul>
    </nav>

    <a href="index.html#contato" class="botao-fala-conosco">Fale Conosco</a>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    <header class="galeria-cabecalho">
      <h1>Galeria de Fotos</h1>
      <p>Conheça a linha completa de bicicletas SoftBike em detalhes e momentos inesquecíveis.</p>
    </header>

    <section class="galeria-container" aria-label="Galeria de fotos SoftBike">
      <div class="galeria-grid">
        
        <figure class="galeria-item">
          <img src="img/bike1.jpg" alt="Três crianças pedalando juntas em um gramado ensolarado cheio de dentes-de-leão" width="400" height="300" decoding="async">
          <figcaption class="sr-only">Linha infantil masculina 1</figcaption>
        </figure>

        <figure class="galeria-item">
          <img src="img/bike2.jpg" alt="Quatro estudantes de mochilas e capacetes parados com suas bicicletas na calçada a caminho da escola" width="400" height="300" decoding="async">
          <figcaption class="sr-only">Linha infantil masculina 2</figcaption>
        </figure>

        <figure class="galeria-item">
          <img src="img/bike3.jpg" alt="Três jovens pedalando juntos e sorrindo em uma pista de parque arborizado" width="400" height="300" decoding="async">
          <figcaption class="sr-only">Linha infantil feminina 1</figcaption>
        </figure>

        <figure class="galeria-item">
          <img src="img/bike4.jpg" alt="Três crianças com mochilas atravessando a faixa de pedestres com bicicleta e patinetes" width="400" height="300" decoding="async">
          <figcaption class="sr-only"></figcaption>
        </figure>

        <figure class="galeria-item">
          <img src="img/bike5.jpg" alt="Um garoto e uma garota de capacete pedalando em uma ciclovia asfaltada no campo" width="400" height="300" decoding="async">
          <figcaption class="sr-only"></figcaption>
        </figure>

        <figure class="galeria-item">
          <img src="img/bike6.jpg" alt="Menino negro sorridente com capacete cinza debruçado sobre o guidão de sua bicicleta vermelha" width="400" height="300" decoding="async">
          <figcaption class="sr-only">linha capacetes femininos</figcaption>
        </figure>

        <figure class="galeria-item">
          <img src="img/bike7.jpg" alt="Dois meninos pedalando em uma rua arborizada durante o dia" width="400" height="300" loading="lazy" decoding="async">
          <figcaption class="sr-only">Linha capacetes masculinos</figcaption>
        </figure>

        <figure class="galeria-item">
          <img src="img/bike8.jpg" alt="Menino de capacete e mochila azul andando em uma bicicleta vermelha na rua" width="400" height="300" loading="lazy" decoding="async">
          <figcaption class="sr-only">Buzinas personalizadas</figcaption>
        </figure>

        <figure class="galeria-item">
          <img src="img/bike9.jpg" alt="Um garoto e uma garota tirando os pés dos pedais e brincando enquanto andam de bicicleta no parque outonal" width="400" height="300" loading="lazy" decoding="async">
          <figcaption class="sr-only">Modelos para crianças</figcaption>
        </figure>

        <figure class="galeria-item">
          <img src="img/bike10.jpg" alt="Grupo de crianças de capacete pedalando em uma trilha de terra em meio às árvores" width="400" height="300" loading="lazy" decoding="async">
          <figcaption class="sr-only">Linha pré-adolescentes</figcaption>
        </figure>

      </div>
    </section>
  </main>

  <!-- Rodapé -->
  <footer class="rodape">
    <p>&copy; 2026 SoftBike. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
