<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe — Hub de Documentos</title>
    <style>
        body { margin: 0; background: #f2f2f2; padding: 24px; }
        body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; color: #222; }
        .label { font-size: 11px; color: #8a8a8a; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; font-weight: 700; }
        .line { height: 9px; background: #cfcfcf; border-radius: 2px; }
        .box { border: 1px solid #bbb; }
    </style>
</head>
<body>
<div style="width:520px; background:#ffffff; padding:32px 40px; box-sizing:border-box;">

  <div class="label">Página simples, sem header/rodapé — só um hub de links técnicos</div>
  <div class="line" style="width:160px; height:22px; margin-bottom:24px;"></div>

  <div style="display:flex; flex-direction:column; gap:14px;">
    <div class="box" style="padding:12px 16px; border-radius:6px;">
      <div class="line" style="width:55%; background:#049c8a;"></div>
    </div>
    <div class="box" style="padding:12px 16px; border-radius:6px;">
      <div class="line" style="width:60%; background:#049c8a;"></div>
    </div>
    <div class="box" style="padding:12px 16px; border-radius:6px;">
      <div class="line" style="width:40%; background:#049c8a;"></div>
    </div>
  </div>

  <div style="margin-top:20px; font-size:11px; color:#999;">Links: Tabela Comparativa · Formatação de Texto · Listas</div>
</div>
</body>
</html>
